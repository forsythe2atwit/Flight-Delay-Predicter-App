<!DOCTYPE html>
<html>
<head>
    <title>FlightRadar24 Geofence Monitor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #333; color: white; }
    </style>
</head>
<body>
    <h1>✈️ Flights Inside Geofence</h1>

    {% if flights %}
        <table>
            <tr>
                <th>Flight ID</th>
                <th>Callsign</th>
                <th>Latitude</th>
                <th>Longitude</th>
            </tr>
            {% for f in flights %}
            <tr>
                <td>{{ f.fr24_id }}</td>
                <td>{{ f.callsign }}</td>
                <td>{{ f.lat }}</td>
                <td>{{ f.lon }}</td>
            </tr>
            {% endfor %}
        </table>
    {% else %}
        <p>No flights currently inside the area.</p>
    {% endif %}
</body>
</html>
